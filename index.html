<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>No</title>
</head>
<body>
<script>
const params = new URLSearchParams(window.location.search);
const base = 'https://xyb-es.github.io/no-as-a-github-page/';
let url = 'https://raw.githubusercontent.com/hotheadhacker/no-as-a-service/refs/heads/main/reasons.json';
let currentMode = 'default';

if (params.has('rude')) {
  url = base + 'rude-reasons.json';
  currentMode = 'rude';
} else if (params.has('corp')) {
  url = base + 'corporate-reasons.json';
  currentMode = 'corp';
} else if (params.has('obscene')) {
  url = base + 'obscene-reasons.json';
  currentMode = 'obscene';
}

fetch(url)
  .then(r => r.json())
  .then(d => {
    const reason = d[Math.floor(Math.random() * d.length)];
    const reasonDiv = document.createElement('div');
    reasonDiv.textContent = reason;
    reasonDiv.style.marginBottom = '20px';

    document.body.appendChild(reasonDiv);
  
  });

  const linksDiv = document.createElement('div');
    const links = [];
    links.push('<ul>')
    if (currentMode !== 'corp') {
      links.push('<li>No in a corporate environment? <a href="https://xyb-es.github.io/no-as-a-github-page/?corp">It would be beneficial for the success of the company if you would interact with this link.</a></li>');
    }
    if (currentMode !== 'rude') {
      links.push('<li>Unpolite no? <a href="https://xyb-es.github.io/no-as-a-github-page//?rude">Click, dolt!</a></li>');
    }
    if (currentMode !== 'obscene') {
      links.push('<li>When they REALLY, REALLY need to understand its a NO (NSFW probably)? <a href="https://xyb-es.github.io/no-as-a-github-page//?obscene">FCKN CLICK HERE!</a></li>');
    }
    if (currentMode !== 'default') {
      links.push('<li>Just plain no? <a href="https://xyb-es.github.io/no-as-a-github-page/">click here</a></li>');
    }
    links.push('</ul>')
    linksDiv.innerHTML = links.join();
  
  document.body.appendChild(linksDiv);

</script>
</body>
</html>
